syntax = "proto3";

package strategy_worker_runtime.contracts.manager_worker.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Worker-origin execution-plane runtime mode for supervision contracts.
enum RuntimeMode {
  RUNTIME_MODE_UNSPECIFIED = 0;
  PAPER = 1;
  LIVE = 2;
  BACKTEST = 3;
}

// Version envelope for additive-compatible schema evolution.
message ContractVersion {
  uint32 schema_version = 1;
  string compatibility_note = 2;
}

// Manager-approved launch payload.
// validated_parameter_identity takes precedence when both it and parameter_hash
// are present. parameter_hash exists for backward-safe compatibility and audit
// scenarios where identity-only references are not available.
message LaunchSpec {
  ContractVersion contract = 1;
  string correlation_id = 2;
  string causation_id = 3;
  string tenant_id = 4;
  string account_id = 5;
  string runtime_id = 6;
  string worker_identity = 7;
  uint32 launch_attempt = 8;
  string strategy_version_id = 9;
  string job_id = 10;
  string deployment_id = 11;
  RuntimeMode mode = 12;
  string trader_id = 13;
  string validated_parameter_identity = 14;
  string parameter_hash = 15;
  string artifact_reference = 16;
  string artifact_uri = 17;
  string artifact_digest = 18;
  string entrypoint = 19;
  string sandbox_profile = 20;
  string requested_by = 21;
  google.protobuf.Timestamp requested_at = 22;
}

message WorkerCreateRequest {
  LaunchSpec launch_spec = 1;
}

message WorkerCreateResponse {
  bool accepted = 1;
  string runtime_id = 2;
  string worker_identity = 3;
  string local_state = 4;
  string reason_code = 5;
  google.protobuf.Timestamp accepted_at = 6;
}

message StopWorkerRequest {
  reserved 1 to 13;
  // Targets a single worker process by platform runtime id (must match this worker's launch spec).
  string runtime_id = 14;
}

message StopWorkerResponse {
  reserved 1 to 14;
  bool accepted = 15;
  string reason_code = 16;
  string local_state = 17;
  string message = 18;
  google.protobuf.Timestamp accepted_at = 19;
}

message HealthCheckRequest {
  ContractVersion contract = 1;
  string correlation_id = 2;
  string causation_id = 3;
  string tenant_id = 4;
  string account_id = 5;
  string runtime_id = 6;
  string worker_identity = 7;
  uint32 launch_attempt = 8;
  string strategy_version_id = 9;
  string job_id = 10;
  string deployment_id = 11;
}

message HealthCheckResponse {
  reserved 1 to 5;
  reserved "live", "ready", "local_state", "reason_code", "observed_at";
  // Worker phase name (e.g. RUNNING). Field 6+ avoids reusing legacy field 1 (bool live) wire type.
  string state = 6;
}

// Worker-origin runtime.heartbeat signal.
// Manager interprets this signal under supervision policy. It does not directly
// establish platform-visible runtime lifecycle truth.
message Heartbeat {
  ContractVersion contract = 1;
  string event_id = 2;
  string event_name = 3;
  uint32 event_version = 4;
  string producer = 5;
  string correlation_id = 6;
  string causation_id = 7;
  string tenant_id = 8;
  string account_id = 9;
  string runtime_id = 10;
  string worker_identity = 11;
  uint32 launch_attempt = 12;
  string strategy_version_id = 13;
  google.protobuf.Timestamp occurred_at = 14;
  google.protobuf.Struct payload = 15;
}

// Worker-origin runtime.launch_succeeded signal.
// Ordering domain for lifecycle interpretation is runtime_id + launch_attempt.
message LaunchSucceeded {
  ContractVersion contract = 1;
  string event_id = 2;
  string event_name = 3;
  uint32 event_version = 4;
  string producer = 5;
  string correlation_id = 6;
  string causation_id = 7;
  string tenant_id = 8;
  string account_id = 9;
  string runtime_id = 10;
  string worker_identity = 11;
  uint32 launch_attempt = 12;
  string strategy_version_id = 13;
  google.protobuf.Timestamp occurred_at = 14;
  google.protobuf.Struct payload = 15;
}

// Worker-origin runtime.launch_failed signal.
// This does not claim manager-owned runtime.failed as canonical platform truth.
message LaunchFailed {
  ContractVersion contract = 1;
  string event_id = 2;
  string event_name = 3;
  uint32 event_version = 4;
  string producer = 5;
  string correlation_id = 6;
  string causation_id = 7;
  string tenant_id = 8;
  string account_id = 9;
  string runtime_id = 10;
  string worker_identity = 11;
  uint32 launch_attempt = 12;
  string strategy_version_id = 13;
  google.protobuf.Timestamp occurred_at = 14;
  google.protobuf.Struct payload = 15;
}

// Worker-origin degraded execution signal.
// Manager owns platform-visible runtime.degraded lifecycle facts.
message RuntimeDegradedSignal {
  ContractVersion contract = 1;
  string event_id = 2;
  string event_name = 3;
  uint32 event_version = 4;
  string producer = 5;
  string correlation_id = 6;
  string causation_id = 7;
  string tenant_id = 8;
  string account_id = 9;
  string runtime_id = 10;
  string worker_identity = 11;
  uint32 launch_attempt = 12;
  string strategy_version_id = 13;
  google.protobuf.Timestamp occurred_at = 14;
  google.protobuf.Struct payload = 15;
}

// Worker-origin controlled stop/termination observed signal.
message TerminationReported {
  ContractVersion contract = 1;
  string event_id = 2;
  string event_name = 3;
  uint32 event_version = 4;
  string producer = 5;
  string correlation_id = 6;
  string causation_id = 7;
  string tenant_id = 8;
  string account_id = 9;
  string runtime_id = 10;
  string worker_identity = 11;
  uint32 launch_attempt = 12;
  string strategy_version_id = 13;
  google.protobuf.Timestamp occurred_at = 14;
  google.protobuf.Struct payload = 15;
}

// Manager-facing runtime bootstrap and supervision RPCs.
service WorkerControlService {
  rpc CreateWorker(WorkerCreateRequest) returns (WorkerCreateResponse);
  rpc StopWorker(StopWorkerRequest) returns (StopWorkerResponse);
  rpc CheckHealth(HealthCheckRequest) returns (HealthCheckResponse);
}

// Worker-origin execution-plane signals.
// These do not directly set platform lifecycle facts like runtime.started,
// runtime.degraded, runtime.failed, or runtime.stopped.
service WorkerLifecycleSignalService {
  rpc ReportLaunchSucceeded(LaunchSucceeded) returns (google.protobuf.Empty);
  rpc ReportLaunchFailed(LaunchFailed) returns (google.protobuf.Empty);
  rpc ReportHeartbeat(Heartbeat) returns (google.protobuf.Empty);
  rpc ReportDegraded(RuntimeDegradedSignal) returns (google.protobuf.Empty);
  rpc ReportTermination(TerminationReported) returns (google.protobuf.Empty);
}
