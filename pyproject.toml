[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-worker-runtime"
version = "0.1.0"
description = "Strategy worker bootstrap and runtime assembly"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joseph Ferguson", email = "fergusonjoseph521@gmail.com" }]
dependencies = [
    "greenlet==3.4.0",
    "grpcio==1.78.0",
    "numpy==2.4.3",
    "pandas==3.0.2",
    "protobuf==6.33.6",
    "python-dateutil==2.9.0.post0",
    "PyYAML==6.0.3",
    "redis==7.4.0",
    "SQLAlchemy==2.0.48",
    "typing_extensions==4.15.0",
    "colorlog==6.10.1",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "grpcio-tools==1.78.0",
    "iniconfig==2.3.0",
    "isort==5.13.2",
    "librt==0.9.0",
    "mypy==1.19.1",
    "mypy_extensions==1.1.0",
    "packaging==26.0",
    "pathspec==1.0.4",
    "platformdirs==4.9.6",
    "pluggy==1.6.0",
    "Pygments==2.20.0",
    "pytest==9.0.3",
    "ruff==0.15.6",
    "six==1.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]
exclude = ["tests*", "alphovex_sdk*"]

[tool.pytest.ini_options]
pythonpath = [".", "protos/generated"]
markers = [
    "integration: integration tests requiring subprocess or external services",
]

[tool.ruff]
# Generated protobuf / gRPC stubs; do not hand-edit (regenerated from .proto).
extend-exclude = [
    "protos/generated",
    "strategy_bundle",
    "runtime/infrastructure/grpc/risk_worker_pb2.py",
    "runtime/infrastructure/grpc/risk_worker_pb2_grpc.py",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
disable_error_code = ["import-untyped"]
exclude = ["^protos/generated/", "^mock_server/runtime_manager/"]

[tool.isort]
profile = "black"

[tool.ruff.format]
exclude = [
    "protos/generated",
    "runtime/infrastructure/grpc/risk_worker_pb2.py",
    "runtime/infrastructure/grpc/risk_worker_pb2_grpc.py",
]

[tool.ruff.lint.per-file-ignores]
# Intentionally broken strategy artifacts for contract / runtime tests.
".swr-runtime/**" = ["F821"]
"mock_server/runtime_manager/test_cases/**" = ["F821"]
"mock_server/runtime_manager/test_cases_sma_cross_over/**" = ["F821"]
