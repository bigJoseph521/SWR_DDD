syntax = "proto3";

package strategy_worker_runtime.contracts.replay_worker.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Version envelope for additive-compatible schema evolution.
message ContractVersion {
  uint32 schema_version = 1;
  string compatibility_note = 2;
}

// Shared identity and correlation metadata.
message CommonMetadata {
  string correlation_id = 1;
  string causation_id = 2;
  string tenant_id = 3;
  string account_id = 4;
  string runtime_id = 5;
  string worker_identity = 6;
  uint32 launch_attempt = 7;
  string strategy_version_id = 8;
  string job_id = 9;
  string deployment_id = 10;
}

enum ReplayCoverageStatus {
  REPLAY_COVERAGE_UNSPECIFIED = 0;
  COVERAGE_PRESENT = 1;
  COVERAGE_PARTIAL = 2;
  COVERAGE_MISSING = 3;
}

// Explicit event ordering key for replay sequencing.
enum ReplayOrderKey {
  REPLAY_ORDER_KEY_UNSPECIFIED = 0;
  EVENT_TIME_ASC = 1;
  EVENT_TIME_ASC_SEQUENCE_ASC = 2;
}

message ReplayMetadata {
  ContractVersion contract = 1;
  CommonMetadata meta = 2;
  string replay_session_id = 3;
  string replay_cursor = 4;
  string dataset_version = 5;
  string policy_snapshot_id = 6;
  ReplayOrderKey order_key = 7;
}

message ReplayEvent {
  string event_id = 1;
  string event_type = 2;
  string instrument_id = 3;
  google.protobuf.Timestamp event_time = 4;
  uint64 sequence = 5;
  google.protobuf.Struct payload = 6;
}

// Replay context from backtest-service to worker.
// backtest-service owns replay orchestration and simulated time.
message ReplayContext {
  ReplayMetadata replay = 1;
  repeated ReplayEvent events = 2;
  google.protobuf.Timestamp simulated_time = 3;
  bool end_of_stream = 4;
  string continuation_token = 5;
}

message ReplayAck {
  string runtime_id = 1;
  string replay_session_id = 2;
  string replay_cursor = 3;
  uint32 consumed_count = 4;
  google.protobuf.Timestamp observed_at = 5;
}

// Worker lookback request mediated by backtest-service only.
// This contract must not drift into general bulk export/retrieval.
message ReplayLookbackRequest {
  ReplayMetadata replay = 1;
  string instrument_id = 2;
  string dataset_family = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  uint32 limit = 6;
  string request_purpose = 7;
  string continuation_token = 8;
}

message CoverageMetadata {
  ReplayCoverageStatus coverage_status = 1;
  bool truncated_by_policy = 2;
  bool invalid_cursor = 3;
  bool unsupported_request_shape = 4;
  bool out_of_policy_range = 5;
  string reason_code = 6;
}

message HistoricalWindowItem {
  string instrument_id = 1;
  google.protobuf.Timestamp event_time = 2;
  uint64 sequence = 3;
  google.protobuf.Struct payload = 4;
}

// Coverage-aware bounded lookback response from backtest-service.
message ReplayLookbackResponse {
  ReplayMetadata replay = 1;
  repeated HistoricalWindowItem items = 2;
  CoverageMetadata coverage = 3;
  string next_continuation_token = 4;
  google.protobuf.Timestamp served_at = 5;
}

// Backtest-only order intent path.
// Backtest order processing remains owned by backtest-service.
message BacktestOrderIntent {
  ContractVersion contract = 1;
  CommonMetadata meta = 2;
  string replay_session_id = 3;
  string instrument_id = 4;
  string side = 5;
  string order_type = 6;
  string tif = 7;
  string quantity = 8;
  string price = 9;
  string stop_price = 10;
  string client_order_ref = 11;
  google.protobuf.Struct attributes = 12;
  // Wall-clock time on the worker host when the intent was submitted (UTC on wire).
  google.protobuf.Timestamp requested_at = 13;
  // Simulated / strategy time when the intent was created (e.g. ctx.timer.now() in BACKTEST).
  google.protobuf.Timestamp created_at = 14;
  // Same semantics as risk_worker OrderIntent.order_intent_id (UUID per intent).
  string order_intent_id = 15;
}

message BacktestOrderIntentAck {
  string runtime_id = 1;
  string replay_session_id = 2;
  bool accepted = 3;
  string reason_code = 4;
  google.protobuf.Timestamp observed_at = 5;
}

service ReplayIngressService {
  rpc PushReplayContext(ReplayContext) returns (ReplayAck);
}

service ReplayLookbackService {
  rpc GetReplayLookback(ReplayLookbackRequest) returns (ReplayLookbackResponse);
}

service BacktestOrderIntentService {
  rpc SubmitBacktestOrderIntent(BacktestOrderIntent) returns (BacktestOrderIntentAck);
}
