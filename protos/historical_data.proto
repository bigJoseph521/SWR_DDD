syntax = "proto3";

package historical_data;

// Internal gRPC API: read-only historical OHLCV bars from the market-data TimescaleDB
// (md_bar.*), analogous to Massive.com aggregates/custom-bars (t, o, h, l, c, v, vw, n)
// but keyed by instrument_id with optional symbol resolution.

option java_multiple_files = true;
option java_package = "com.alphovex.historical_data";

// Canonical gRPC status codes (numeric values 0–16 match the wire `grpc-status` and https://grpc.io/docs/guides/status-codes/).
enum GrpcStatusCode {
  GRPC_OK = 0;
  GRPC_CANCELLED = 1;
  GRPC_UNKNOWN = 2;
  GRPC_INVALID_ARGUMENT = 3;
  GRPC_DEADLINE_EXCEEDED = 4;
  GRPC_NOT_FOUND = 5;
  GRPC_ALREADY_EXISTS = 6;
  GRPC_PERMISSION_DENIED = 7;
  GRPC_RESOURCE_EXHAUSTED = 8;
  GRPC_FAILED_PRECONDITION = 9;
  GRPC_ABORTED = 10;
  GRPC_OUT_OF_RANGE = 11;
  GRPC_UNIMPLEMENTED = 12;
  GRPC_INTERNAL = 13;
  GRPC_UNAVAILABLE = 14;
  GRPC_DATA_LOSS = 15;
  GRPC_UNAUTHENTICATED = 16;
}

// Echoes the outcome in the response body for JSON/transcoding clients; the RPC `grpc-status` remains authoritative for failed RPCs.
message RpcGrpcStatus {
  GrpcStatusCode code = 1;
}

// Bar open time: `time_utc` matches `md_bar.bars_* .time_utc` text form (e.g. 2026-03-13 11:00:00+00).
message HistoricalBar {
  int64 instrument_id = 1;
  reserved 2;
  reserved "t_unix_ms";
  string time_utc = 10;
  double open = 3;
  double high = 4;
  double low = 5;
  double close = 6;
  int64 volume = 7;
  optional double vwap = 8;
  optional int32 trade_count = 9;
}

// --- Unified historical query (single symbol; same `time_utc` format as `md_bar`) ---

// Only BAR is implemented; other values are reserved.
enum HistoricalDataType {
  HISTORICAL_DATA_TYPE_UNSPECIFIED = 0;
  HISTORICAL_DATA_TYPE_BAR = 1;
}

// Ingestion-trust for the **requested** `[from_utc, to_utc)` only (from `symbol_data_verification` hull).
// Does not reflect pagination (`has_more`). `untrusted_intervals` exclude ranges with no `md_bar` rows (see `no_stored_bars_intervals`).
enum CoverageStatus {
  COVERAGE_STATUS_UNSPECIFIED = 0;
  // Entire requested window overlaps ingestion-trusted hull.
  COVERAGE_STATUS_FULL = 1;
  // Part of the window is trusted and part is not.
  COVERAGE_STATUS_PARTIAL = 2;
  // No part of the requested window is ingestion-trusted (outside hull / no row / bad trust).
  COVERAGE_STATUS_NO_DATA = 3;
  COVERAGE_STATUS_ERROR = 4;
  // Ingestion-trust is full for the stored-bar span, but part of `[from_utc, to_utc)` has no rows in `md_bar` for this timeframe (see `detailed_coverage.no_stored_bars_intervals`).
  COVERAGE_STATUS_INCLUDES_NO_STORED_BARS_SUBRANGE = 5;
}

// For equity-like symbols: classifies `[from_utc, to_utc)` against a simple US/Eastern weekday (Mon–Fri)
// vs weekend (Sat–Sun) calendar. Does not model exchange holidays, early closes, or extended hours.
// Omitted (unset) for asset classes treated as 24/7 or non–US-calendar (e.g. crypto, fx).
enum RequestedWindowCalendarKind {
  REQUESTED_WINDOW_CALENDAR_KIND_UNSPECIFIED = 0;
  // At least one America/New_York calendar date in the half-open range is Monday–Friday.
  REQUESTED_WINDOW_CALENDAR_KIND_INCLUDES_US_ET_WEEKDAY = 1;
  // Every instant in the range maps to Saturday or Sunday in America/New_York (US weekend-only window).
  REQUESTED_WINDOW_CALENDAR_KIND_ENTIRELY_US_ET_WEEKEND = 2;
}

// When a bar query succeeds but returns zero rows: how that relates to MIN/MAX `time_utc` in `md_bar` for this instrument+timeframe.
// Omitted when the response includes one or more bars.
enum StoredBarsPageEmptyReason {
  STORED_BARS_PAGE_EMPTY_REASON_UNSPECIFIED = 0;
  // No rows exist in the physical `md_bar.bars_*` table for this instrument+resolution.
  STORED_BARS_PAGE_EMPTY_REASON_NO_ROWS_IN_TABLE = 1;
  // Request starts before earliest stored bar open (`from_utc < min(time_utc)`).
  STORED_BARS_PAGE_EMPTY_REASON_REQUEST_BEFORE_STORED_RANGE = 2;
  // Request starts strictly after the latest stored bar open.
  STORED_BARS_PAGE_EMPTY_REASON_REQUEST_AFTER_STORED_RANGE = 3;
  // Stored data overlaps the request window, but this page has no bars (weekend gap, keyset cursor, sparse data, etc.).
  STORED_BARS_PAGE_EMPTY_REASON_OVERLAPS_STORED_SPAN_PAGE_EMPTY = 4;
}

// Request-level session policy used for validation; this endpoint currently supports full-session checks.
enum ValidationSessionMode {
  VALIDATION_SESSION_MODE_UNSPECIFIED = 0;
  VALIDATION_SESSION_MODE_FULL_SESSION = 1;
  VALIDATION_SESSION_MODE_REGULAR_TRADING_HOURS = 2;
}

enum DatasetAvailabilityStatus {
  DATASET_AVAILABILITY_STATUS_UNSPECIFIED = 0;
  DATASET_AVAILABILITY_STATUS_AVAILABLE = 1;
  DATASET_AVAILABILITY_STATUS_EMPTY = 2;
  DATASET_AVAILABILITY_STATUS_PARTIAL = 3;
  DATASET_AVAILABILITY_STATUS_UNSUPPORTED = 4;
}

enum DatasetValidationReasonCode {
  DATASET_VALIDATION_REASON_CODE_UNSPECIFIED = 0;
  DATASET_VALIDATION_REASON_CODE_OK = 1;
  DATASET_VALIDATION_REASON_CODE_UNSUPPORTED_TIMEFRAME = 2;
  DATASET_VALIDATION_REASON_CODE_UNSUPPORTED_SESSION_MODE = 3;
  DATASET_VALIDATION_REASON_CODE_UNSUPPORTED_INSTRUMENT = 4;
  DATASET_VALIDATION_REASON_CODE_EMPTY_RANGE = 5;
  DATASET_VALIDATION_REASON_CODE_PARTIAL_COVERAGE = 6;
  DATASET_VALIDATION_REASON_CODE_NO_DATA_IN_RANGE = 7;
}

message CoverageGapSummary {
  uint32 gap_count = 1;
  repeated CoverageInterval missing_intervals = 2;
}

message DatasetCoverageSummary {
  double coverage_ratio = 1;
  optional uint64 estimated_point_count = 2;
  optional string first_available_at = 3;
  optional string last_available_at = 4;
  optional CoverageGapSummary gap_summary = 5;
}

message InstrumentDatasetCoverageSummary {
  int64 instrument_id = 1;
  bool instrument_supported = 2;
  DatasetAvailabilityStatus availability_status = 3;
  DatasetValidationReasonCode reason_code = 4;
  optional string reason_message = 5;
  reserved 6, 7, 8;
  reserved "first_available_at", "last_available_at", "estimated_point_count";
  optional DatasetCoverageSummary coverage = 9;
}

message ValidateHistoricalDatasetRequest {
  repeated int64 instrument_ids = 1;
  // Optional symbol path for clients that use the same shape as QueryHistoricalData.
  // When `instrument_ids` is provided, it is preferred.
  optional string symbol = 10;
  // Optional disambiguation when `symbol` is used.
  optional string asset_class_code = 11;
  // Case-insensitive: "1m", "5m", "10m", "15m", "30m", "1h", "1w", "1mo".
  string timeframe = 2;
  // Half-open range [from_utc, to_utc) on bar `time_utc`.
  string from_utc = 3;
  string to_utc = 4;
  ValidationSessionMode session_mode = 5;
  // Optional policy hint used by orchestrators when interpreting partial coverage.
  optional double minimum_coverage_ratio = 6;
  optional string request_id = 7;
  optional string correlation_id = 8;
  optional string caller_service = 9;
}

message ValidateHistoricalDatasetResponse {
  bool request_supported = 1;
  DatasetAvailabilityStatus availability_status = 2;
  DatasetValidationReasonCode reason_code = 3;
  optional string reason_message = 4;
  reserved 5;
  reserved "overall_coverage";
  repeated InstrumentDatasetCoverageSummary instrument_summaries = 6;
  reserved 7, 8, 9;
  reserved "first_available_at", "last_available_at", "estimated_point_count";
  optional RpcGrpcStatus api_grpc_status = 10;
}

message QueryHistoricalDataRequest {
  string symbol = 1;
  // When set, disambiguates multiple instruments sharing the same display symbol.
  optional string asset_class_code = 9;
  // Keyset cursor from the previous response `metadata.next_cursor` (bar open `time_utc`, same format as DB).
  optional string cursor = 10;
  // Case-insensitive: "1m", "5m", "10m", "15m", "30m", "1h", "1w", "1mo".
  string timeframe = 2;
  // Half-open range [from_utc, to_utc) on bar `time_utc` (PostgreSQL timestamptz text style, e.g. 2026-03-13 11:00:00+00).
  string from_utc = 3;
  string to_utc = 4;
  HistoricalDataType data_type = 5;
  // When true, client wants split-adjusted series; see `metadata.adjustment_status` for what was actually served.
  optional bool adjusted = 6;
  // Bar order: case-insensitive `asc` / `ascending` (oldest first, default) or `desc` / `descending` (newest first). JSON field `sort`.
  optional string sort = 7;
  // Max bars returned from `[from_utc, to_utc)` only (server clamps). When unset or 0: server default. Does not count `warmup_bars`.
  optional uint32 limit = 8;
  reserved 11;
  reserved "include_detailed_coverage";
  // Optional observability: echoed in structured logs; may also be sent as gRPC metadata (x-request-id, x-correlation-id, x-caller-service).
  optional string request_id = 12;
  optional string correlation_id = 13;
  optional string caller_service = 14;
  // When set (>0) and `cursor` is unset, include up to this many bars with `time_utc` strictly before `from_utc` (indicator warmup).
  // For `sort` ascending (default), warmup bars are prepended (oldest warmup first). For descending, they are appended after the in-window page (newest warmup closest to `from_utc` first in that trailing segment).
  // Ignored on follow-up pages (`cursor` set). Server-clamped by `MAX_WARMUP_BARS`. Optional SQL floor: `WARMUP_LOOKBACK_DAYS`.
  optional uint32 warmup_bars = 15;
}

// Half-open `[start_utc, end_utc)` within the **request** window only (same `time_utc` text style as bars).
message CoverageInterval {
  string start_utc = 1;
  string end_utc = 2;
}

// Request-scoped breakdown: which sub-ranges of `[from_utc, to_utc)` are ingestion-trusted vs not
// (from `symbol_data_verification` hull ∩ request — not the symbol’s global cumulative span alone).
// `untrusted_intervals` are limited to sub-ranges that overlap the `[min(time_utc), max(time_utc)]` bar span in `md_bar` for this resolution (ingestion-not-trusted while bars could exist).
message DetailedCoverage {
  repeated CoverageInterval trusted_intervals = 1;
  repeated CoverageInterval untrusted_intervals = 2;
  // Sub-ranges with no OHLCV rows in `md_bar` for this instrument+timeframe (typically before first or after last stored bar open); not ingestion-trust failures.
  repeated CoverageInterval no_stored_bars_intervals = 3;
}

message HistoricalResultMetadata {
  bool has_more = 1;
  optional string next_cursor = 2;
  CoverageStatus coverage_status = 3;
  optional string status_detail = 4;
  // Sub-ranges of the requested `[from_utc, to_utc)` only.
  optional DetailedCoverage detailed_coverage = 5;
  reserved 6;
  reserved "verification_rollup";
  // How OHLCV is adjusted: lowercase `unadjusted` (md_bar as stored) or `adjusted` when split-adjusted series is applied.
  optional string adjustment_status = 7;
  // Set for equity-like instruments when the service applies a US/Eastern session calendar hint.
  optional RequestedWindowCalendarKind requested_window_calendar_kind = 8;
  // Set only when `bars` is empty: request vs MIN/MAX bar times in `md_bar` for this symbol+timeframe.
  optional StoredBarsPageEmptyReason stored_bars_page_empty_reason = 9;
  // How many bars in `bars` came from warmup (`time_utc` < request `from_utc`). Omitted when zero.
  optional uint32 warmup_bars_returned = 10;
}

// Flat response so JSON/transcoding clients get OHLCV at the top level (no nested `result` wrapper).
message QueryHistoricalDataResponse {
  string symbol = 1;
  uint64 query_counts = 2;
  string timeframe = 3;
  repeated HistoricalBar bars = 4;
  HistoricalResultMetadata metadata = 5;
  optional RpcGrpcStatus api_grpc_status = 6;
}

// First-party health on `HistoricalDataService` (same port as `QueryHistoricalData`).
// For Kubernetes-style probes, prefer `grpc.health.v1.Health/Check` (see README).
message HealthCheckRequest {}

message HealthCheckResponse {
  // e.g. "ok" when the RPC succeeds.
  string status = 1;
}

service HistoricalDataService {
  rpc QueryHistoricalData(QueryHistoricalDataRequest) returns (QueryHistoricalDataResponse);
  rpc ValidateHistoricalDataset(ValidateHistoricalDatasetRequest) returns (ValidateHistoricalDatasetResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}
